<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About Admin | Neeraj.dev</title>
<link rel="stylesheet" href="css/style.css">

<style>
.about-admin-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.about-admin-header h2{
  font-size:28px;
  color:#111827;
}

.about-admin-header p{
  color:#6b7280;
  margin-top:6px;
}

.about-card{
  background:#fff;
  border-radius:22px;
  padding:26px;
  box-shadow:0 14px 40px rgba(0,0,0,.07);
  border:1px solid #fce7f3;
}

.about-form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.about-field{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.about-field.full{
  grid-column:1 / -1;
}

.about-field label{
  font-weight:800;
  color:#111827;
}

.about-field input,
.about-field textarea{
  width:100%;
  padding:15px 16px;
  border:1px solid #e5e7eb;
  border-radius:14px;
  font-size:15px;
  outline:none;
  background:#fff;
}

.about-field textarea{
  min-height:120px;
  resize:vertical;
}

.about-field input:focus,
.about-field textarea:focus{
  border-color:#db2777;
  box-shadow:0 0 0 3px rgba(219,39,119,.12);
}

.save-about-btn{
  margin-top:22px;
  background:#db2777;
  color:white;
  border:none;
  padding:14px 24px;
  border-radius:14px;
  font-weight:800;
  cursor:pointer;
}

.preview-box{
  margin-top:25px;
  background:#fff7fb;
  border:1px dashed #db2777;
  border-radius:18px;
  padding:22px;
}

.preview-box h3{
  margin-bottom:12px;
  color:#db2777;
}

@media(max-width:900px){
  .about-form-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body class="admin-body">

<nav class="admin-topbar">
  <div class="admin-brand">
    <span>Neeraj.dev</span>
  </div>

  <div class="admin-actions">
    <a href="admin.html">Main Admin</a>
    <button onclick="logout()">Logout</button>
  </div>
</nav>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <h3>About Admin</h3>
    <a href="admin.html">Dashboard</a>
  </aside>

  <main class="admin-main">
    <section class="admin-section">

      <div class="about-admin-header">
        <div>
          <h2>Manage About Page</h2>
          <p>Update your professional profile section easily.</p>
        </div>
      </div>

      <div class="about-card">
        <form id="aboutForm">

          <div class="about-form-grid">

            <div class="about-field">
              <label>Enter Name</label>
              <input type="text" id="aboutName" placeholder="Example: Neeraj Swami" required>
            </div>

            <div class="about-field">
              <label>Currently Working</label>
              <input type="text" id="aboutCurrentWork" placeholder="Example: IT Support Assistant at NHAI">
            </div>

            <div class="about-field full">
              <label>Working Experience</label>
              <textarea id="aboutExperience" placeholder="Write your working experience"></textarea>
            </div>

            <div class="about-field full">
              <label>My Skills</label>
              <textarea id="aboutSkills" placeholder="Example: Python, HTML, CSS, JavaScript, MySQL"></textarea>
            </div>

            <div class="about-field">
              <label>Language Knowledge</label>
              <textarea id="aboutLanguages" placeholder="Example: Hindi, English, Punjabi"></textarea>
            </div>

            <div class="about-field">
              <label>My Education</label>
              <textarea id="aboutEducation" placeholder="Example: BA, PGDCA, RBSE"></textarea>
            </div>

            <div class="about-field full">
              <label>Let's Connect and Grow Together</label>
              <textarea id="aboutConnect" placeholder="Write your closing line"></textarea>
            </div>

          </div>

          <button type="submit" class="save-about-btn">Save About Page</button>
        </form>

        <div class="preview-box">
          <h3>Preview</h3>
          <div id="aboutPreview">Start typing to preview your about section...</div>
        </div>
      </div>

    </section>
  </main>
</div>

<script src="js/app.js"></script>

<script>
const aboutForm = document.getElementById("aboutForm");

const fields = {
  name: document.getElementById("aboutName"),
  currentWork: document.getElementById("aboutCurrentWork"),
  experience: document.getElementById("aboutExperience"),
  skills: document.getElementById("aboutSkills"),
  languages: document.getElementById("aboutLanguages"),
  education: document.getElementById("aboutEducation"),
  connect: document.getElementById("aboutConnect")
};

const aboutPreview = document.getElementById("aboutPreview");

async function loadAboutData(){
  try{
    const res = await fetch("/api/about");
    const data = await res.json();

    fields.name.value = data.name || "Neeraj Swami";
    fields.currentWork.value = data.currentWork || "IT Support Assistant at NHAI";
    fields.experience.value = data.experience || "I have 4+ years of experience in e-Mitra services, government documentation, online applications and citizen support.";
    fields.skills.value = data.skills || "Python, SQL, HTML, CSS, JavaScript, Node.js, FastAPI, Flask, MySQL, SQLite, MS Office";
    fields.languages.value = data.languages || "Hindi, English, Punjabi";
    fields.education.value = data.education || "RBSE Senior Secondary, Bachelor of Arts from MGSU Bikaner, PGDCA from JRRSU Jaipur";
    fields.connect.value = data.connect || "Let's connect and grow together with technology, digital services and professional support.";

    updatePreview();
  }catch(error){
    console.error(error);
  }
}

function updatePreview(){
  aboutPreview.innerHTML = `
    <h2><strong>${escapeHTML(fields.name.value)}</strong></h2>
    <p><strong>Working Experience:</strong> ${escapeHTML(fields.experience.value)}</p>
    <p><strong>Currently Working:</strong> ${escapeHTML(fields.currentWork.value)}</p>
    <p><strong>My Skills:</strong> ${escapeHTML(fields.skills.value)}</p>
    <p><strong>Language Knowledge:</strong> ${escapeHTML(fields.languages.value)}</p>
    <p><strong>My Education:</strong> ${escapeHTML(fields.education.value)}</p>
    <p><strong>Let's Connect and Grow Together:</strong> ${escapeHTML(fields.connect.value)}</p>
  `;
}

aboutForm.addEventListener("submit", async function(e){
  e.preventDefault();

  const aboutData = {
    name: fields.name.value,
    currentWork: fields.currentWork.value,
    experience: fields.experience.value,
    skills: fields.skills.value,
    languages: fields.languages.value,
    education: fields.education.value,
    connect: fields.connect.value
  };

  const res = await fetch("/api/admin/about", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(aboutData)
  });

  const data = await res.json();
  alert(data.message || "About page updated successfully");
});

Object.values(fields).forEach(field => {
  field.addEventListener("input", updatePreview);
});

function escapeHTML(value){
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

loadAboutData();
</script>

</body>
</html>
