<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Admin | Neeraj.dev</title>
<link rel="stylesheet" href="css/style.css">
</head>

<script src="js/visitor.js"></script>
<body class="admin-body">

<nav class="admin-topbar">
  <div class="admin-brand"><span>Neeraj.dev</span></div>
  <div class="admin-actions">
    <a href="admin.html">Main Admin</a>
    <button onclick="logout()">Logout</button>
  </div>
</nav>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <h3>Resume Admin</h3>
    <a href="admin.html">Dashboard</a>
  </aside>

  <main class="admin-main">
    <section class="admin-section">
      <h2>Resume Manager</h2>

      <form id="resumeForm" class="admin-form" enctype="multipart/form-data">
        <input type="file" id="resumeFile" name="resume" accept="application/pdf" required>
        <button type="submit">Upload Resume PDF</button>
      </form>

      <div id="adminResumeStatus" class="admin-status"></div>
    </section>
  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
