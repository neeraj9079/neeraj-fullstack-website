<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login | Neeraj.dev</title>
<link rel="stylesheet" href="css/style.css">

<style>
.login-page{
  min-height:calc(100vh - 80px);
  background:linear-gradient(135deg,#fff7fb,#eef4ff);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:50px 7%;
}

.login-card{
  width:100%;
  max-width:460px;
  background:#fff;
  border:1px solid #fce7f3;
  border-radius:26px;
  padding:36px;
  box-shadow:0 18px 50px rgba(0,0,0,.09);
}

.login-badge{
  display:inline-block;
  background:#fce7f3;
  color:#be185d;
  padding:8px 14px;
  border-radius:30px;
  font-weight:800;
  font-size:13px;
  margin-bottom:18px;
}

.login-card h1{
  font-size:34px;
  color:#111827;
  margin-bottom:10px;
}

.login-card p{
  color:#6b7280;
  margin-bottom:26px;
  line-height:1.6;
}

.login-form{
  display:grid;
  gap:16px;
}

.login-form input{
  width:100%;
  padding:16px;
  border:1px solid #e5e7eb;
  border-radius:15px;
  font-size:15px;
  outline:none;
  background:#f8fbff;
}

.login-form input:focus{
  border-color:#db2777;
  box-shadow:0 0 0 3px rgba(219,39,119,.12);
  background:#fff;
}

.login-btn{
  background:#db2777;
  color:#fff;
  border:0;
  padding:15px;
  border-radius:15px;
  font-weight:900;
  cursor:pointer;
  font-size:15px;
  box-shadow:0 10px 25px rgba(219,39,119,.25);
}

.login-btn:hover{
  background:#be185d;
}

.login-links{
  margin-top:22px;
  text-align:center;
  color:#374151;
}

.login-links a{
  color:#db2777;
  font-weight:800;
  text-decoration:none;
}

.login-note{
  margin-top:20px;
  background:#fff7fb;
  border:1px solid #fce7f3;
  padding:13px;
  border-radius:14px;
  color:#6b7280;
  font-size:14px;
  text-align:center;
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="logo">
    <img id="siteLogoImage" src="" alt="Logo">
    <span id="siteLogoText">Neeraj.dev</span>
  </div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="gallery.html">Gallery</a>
    <a href="resume.html">Resume</a>
    <a href="hire.html">Hire Me</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
  </div>
</nav>

<section class="login-page">
  <div class="login-card">
    <span class="login-badge">Admin & User Access</span>

    <h1>Welcome Back</h1>
    <p>Sign in to access your account dashboard and admin panel.</p>

    <form class="login-form" onsubmit="handleLogin(event)">
      <input type="email" name="email" placeholder="Enter your email" required>
      <input type="password" name="password" placeholder="Enter your password" required>
      <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="login-links">
      New user? <a href="register.html">Create an account</a>
    </div>

    <div class="login-note">
      Secure login powered by Neeraj.dev
    </div>
  </div>
</section>

<script src="js/visitor.js"></script>
<script src="js/app.js"></script>

</body>
</html>
