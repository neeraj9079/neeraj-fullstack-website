<script>
async function loadHirePage(){
  const res = await fetch("/api/hire");
  const data = await res.json();

  document.getElementById("hireTitle").innerText = data.title || "Hire Me";
  document.getElementById("hireIntro").innerText = data.intro || "";

  document.getElementById("hireServicesGrid").innerHTML = (data.services || []).map(service => `
    <div class="service">
      <h3>${service.title}</h3>
      <p>${service.description}</p>
    </div>
  `).join("");

  document.getElementById("hireMainBtn").innerText = data.buttonText || "Hire Me Now";
  document.getElementById("hireResumeBtn").innerText = data.resumeButtonText || "View Resume";
}

loadHirePage();
</script>
