<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>e-Mitra Professional Portal | Neeraj.dev</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
  <div class="logo">
    <span>Neeraj.dev</span>
  </div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="emitra.html">e-Mitra Portal</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<section class="section">
  <h1>e-Mitra Professional Portal</h1>

  <input
  type="text"
  id="serviceSearch"
  class="emitra-search"
  placeholder="Search Service..."
>

  <div id="emitraServicesContainer" class="grid">
    <p>Loading Services...</p>
  </div>
</section>

<script>
const WHATSAPP_NUMBER = "919079209552";

const searchBox = document.getElementById("serviceSearch");
const container = document.getElementById("emitraServicesContainer");

let allServices = [];

async function loadServices() {
  try {
    const res = await fetch("/api/emitra-services");
    allServices = await res.json();
    renderServices(allServices);
  } catch (err) {
    console.error(err);
    container.innerHTML = "<p>Unable to load services.</p>";
  }
}

function renderServices(services) {
  if (!services.length) {
    container.innerHTML = "<p>No services available.</p>";
    return;
  }

  container.innerHTML = services.map(service => {
    const message = encodeURIComponent(
      `Hello Neeraj Ji, I want to apply for ${service.name}. Please guide me.`
    );

    return `
      <div class="service">
        <h3>${service.name}</h3>

        <p><strong>Category:</strong> ${service.category}</p>
        <p><strong>Documents:</strong> ${service.documents}</p>
        <p><strong>Fees:</strong> ${service.fees || "N/A"}</p>
        <p><strong>Processing Time:</strong> ${service.processingTime || "N/A"}</p>
        <p><strong>Status:</strong> ${service.status}</p>

        ${service.description ? `<p>${service.description}</p>` : ""}

        <div class="emitra-card-actions">
          ${service.formPdf ? `
            <a
              class="btn secondary"
              href="${service.formPdf}"
              target="_blank"
              download
            >
              📂 Download Form
            </a>
          ` : ""}

          <a
            class="btn"
            target="_blank"
            href="https://wa.me/${WHATSAPP_NUMBER}?text=${message}"
          >
            📲 Apply on WhatsApp
          </a>
        </div>
      </div>
    `;
  }).join("");
}

searchBox.addEventListener("input", () => {
  const keyword = searchBox.value.toLowerCase();

  const filtered = allServices.filter(service =>
    service.name.toLowerCase().includes(keyword) ||
    service.category.toLowerCase().includes(keyword) ||
    service.documents.toLowerCase().includes(keyword)
  );

  renderServices(filtered);
});

loadServices();
</script>

</body>
</html>
