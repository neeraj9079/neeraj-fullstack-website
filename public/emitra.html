<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>e-Mitra Professional Portal | Neeraj.dev</title>
<link rel="stylesheet" href="css/style.css">

<style>
body {
  background: #fff7fb;
}

.emitra-wrapper {
  padding: 55px 7%;
}

.emitra-title {
  font-size: 38px;
  margin-bottom: 10px;
  color: #111827;
}

.emitra-subtitle {
  color: #6b7280;
  margin-bottom: 25px;
}

.emitra-search {
  width: 100%;
  max-width: 900px;
  padding: 16px 18px;
  border-radius: 14px;
  border: 1px solid #e5e7eb;
  background: #fff;
  font-size: 16px;
  margin-bottom: 30px;
  outline: none;
}

.emitra-search:focus {
  border-color: #db2777;
  box-shadow: 0 0 0 3px rgba(219,39,119,0.12);
}

.emitra-card-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 28px;
}

.emitra-card-box {
  background: #fff;
  border: 1px solid #fce7f3;
  border-radius: 22px;
  padding: 24px;
  min-height: 430px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.07);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.emitra-card-box h3 {
  color: #db2777;
  font-size: 23px;
  line-height: 1.3;
  margin-bottom: 14px;
  text-transform: capitalize;
  word-break: break-word;
}

.emitra-card-box p {
  font-size: 15px;
  line-height: 1.55;
  color: #374151;
  margin-bottom: 8px;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.emitra-card-box strong {
  color: #111827;
}

.emitra-card-body {
  flex: 1;
}

.emitra-actions {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding-top: 16px;
}

.emitra-action-btn {
  width: 220px;
  max-width: 100%;
  min-height: 46px;
  border-radius: 12px;
  border: none;
  text-decoration: none;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px 14px;
  background: #db2777;
  color: #fff;
}

.emitra-action-btn.dark {
  background: #111827;
}

.emitra-empty {
  background: #fff;
  border-radius: 18px;
  padding: 25px;
  border: 1px solid #fce7f3;
}

@media (max-width: 1100px) {
  .emitra-card-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 720px) {
  .emitra-wrapper {
    padding: 40px 6%;
  }

  .emitra-title {
    font-size: 30px;
  }

  .emitra-card-grid {
    grid-template-columns: 1fr;
  }

  .emitra-card-box {
    min-height: auto;
  }
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="logo">
    <span>Neeraj.dev</span>
  </div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="emitra.html">e-Mitra Portal</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<section class="emitra-wrapper">
  <h1 class="emitra-title">e-Mitra Professional Portal</h1>
  <p class="emitra-subtitle">
    Search government services, required documents, forms and apply support.
  </p>

  <input
    type="text"
    id="serviceSearch"
    class="emitra-search"
    placeholder="Search Service..."
  >

  <div id="emitraServicesContainer" class="emitra-card-grid">
    <div class="emitra-empty">Loading Services...</div>
  </div>
</section>

<script>
const WHATSAPP_NUMBER = "919079209552";

const searchBox = document.getElementById("serviceSearch");
const container = document.getElementById("emitraServicesContainer");

let allServices = [];

async function loadServices() {
  try {
    const res = await fetch("/api/emitra-services");
    allServices = await res.json();
    renderServices(allServices);
  } catch (err) {
    console.error(err);
    container.innerHTML = '<div class="emitra-empty">Unable to load services.</div>';
  }
}

function cleanText(value, limit) {
  const text = String(value || "").trim();

  if (!text) return "N/A";

  const spaced = text.replace(/([A-Z0-9]){18,}/g, function(match) {
    return match.match(/.{1,12}/g).join(" ");
  });

  return spaced.length > limit ? spaced.substring(0, limit) + "..." : spaced;
}

function renderServices(services) {
  if (!services.length) {
    container.innerHTML = '<div class="emitra-empty">No services available.</div>';
    return;
  }

  container.innerHTML = services.map(service => {
    const message = encodeURIComponent(
      `Hello Neeraj Ji, I want to apply for ${service.name}. Please guide me.`
    );

    return `
      <div class="emitra-card-box">
        <div class="emitra-card-body">
          <h3>${cleanText(service.name, 45)}</h3>

          <p><strong>Category:</strong> ${cleanText(service.category, 45)}</p>
          <p><strong>Documents:</strong> ${cleanText(service.documents, 95)}</p>
          <p><strong>Fees:</strong> ${cleanText(service.fees, 35)}</p>
          <p><strong>Processing Time:</strong> ${cleanText(service.processingTime, 35)}</p>
          <p><strong>Status:</strong> ${cleanText(service.status || "Active", 25)}</p>

          ${
            service.description
              ? `<p>${cleanText(service.description, 90)}</p>`
              : ""
          }
        </div>

        <div class="emitra-actions">
          ${
            service.formPdf
              ? `<a class="emitra-action-btn dark" href="${service.formPdf}" target="_blank" download>📂 Download Form</a>`
              : ""
          }

          <a
            class="emitra-action-btn"
            target="_blank"
            href="https://wa.me/${WHATSAPP_NUMBER}?text=${message}"
          >
            📲 Apply on WhatsApp
          </a>
        </div>
      </div>
    `;
  }).join("");
}

searchBox.addEventListener("input", () => {
  const keyword = searchBox.value.toLowerCase();

  const filtered = allServices.filter(service =>
    String(service.name || "").toLowerCase().includes(keyword) ||
    String(service.category || "").toLowerCase().includes(keyword) ||
    String(service.documents || "").toLowerCase().includes(keyword)
  );

  renderServices(filtered);
});

loadServices();
</script>

</body>
</html>
