<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>e-Mitra Professional Portal | Neeraj.dev</title>
<link rel="stylesheet" href="css/style.css">

<style>
body {
  background: #fff7fb;
}

.emitra-wrapper {
  padding: 55px 7%;
}

.emitra-title {
  font-size: 38px;
  margin-bottom: 10px;
  color: #111827;
}

.emitra-subtitle {
  color: #6b7280;
  margin-bottom: 25px;
}

.emitra-filter-box {
  background: #fff;
  border: 1px solid #fce7f3;
  border-radius: 22px;
  padding: 22px;
  margin-bottom: 30px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.06);
}

.emitra-filter-row {
  display: grid;
  grid-template-columns: 2fr 1fr auto;
  gap: 15px;
  align-items: center;
}

.emitra-search,
.emitra-category {
  width: 100%;
  padding: 16px 18px;
  border-radius: 14px;
  border: 1px solid #e5e7eb;
  background: #fff;
  font-size: 16px;
  outline: none;
}

.emitra-search:focus,
.emitra-category:focus {
  border-color: #db2777;
  box-shadow: 0 0 0 3px rgba(219,39,119,0.12);
}

.clear-filter-btn {
  padding: 16px 22px;
  border: none;
  border-radius: 14px;
  background: #111827;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.emitra-count {
  margin-top: 15px;
  color: #6b7280;
  font-size: 15px;
}

.emitra-count strong {
  color: #db2777;
}

.emitra-card-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 28px;
}

.emitra-card-box {
  background: #fff;
  border: 1px solid #fce7f3;
  border-radius: 22px;
  padding: 24px;
  min-height: 430px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.07);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: 0.25s ease;
}

.emitra-card-box:hover {
  transform: translateY(-5px);
  box-shadow: 0 16px 45px rgba(219,39,119,0.14);
}

.emitra-card-box h3 {
  color: #db2777;
  font-size: 23px;
  line-height: 1.3;
  margin-bottom: 14px;
  text-transform: capitalize;
  word-break: break-word;
}

.emitra-card-box p {
  font-size: 15px;
  line-height: 1.55;
  color: #374151;
  margin-bottom: 8px;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.emitra-card-box strong {
  color: #111827;
}

.category-badge {
  display: inline-block;
  background: #fce7f3;
  color: #be185d;
  padding: 6px 12px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 12px;
}

.status-badge {
  display: inline-block;
  background: #dcfce7;
  color: #166534;
  padding: 5px 10px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 700;
}

.status-badge.inactive {
  background: #fee2e2;
  color: #991b1b;
}

.emitra-card-body {
  flex: 1;
}

.emitra-actions {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding-top: 16px;
}

.emitra-action-btn {
  width: 220px;
  max-width: 100%;
  min-height: 46px;
  border-radius: 12px;
  border: none;
  text-decoration: none;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12px 14px;
  background: #db2777;
  color: #fff;
}

.emitra-action-btn.dark {
  background: #111827;
}

.emitra-empty {
  grid-column: 1 / -1;
  background: #fff;
  border-radius: 18px;
  padding: 30px;
  border: 1px solid #fce7f3;
  text-align: center;
  color: #6b7280;
  font-size: 16px;
}

@media (max-width: 1100px) {
  .emitra-card-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .emitra-filter-row {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 720px) {
  .emitra-wrapper {
    padding: 40px 6%;
  }

  .emitra-title {
    font-size: 30px;
  }

  .emitra-card-grid {
    grid-template-columns: 1fr;
  }

  .emitra-card-box {
    min-height: auto;
  }
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="logo">
    <span>Neeraj.dev</span>
  </div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="emitra.html">e-Mitra Portal</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<section class="emitra-wrapper">
  <h1 class="emitra-title">e-Mitra Professional Portal</h1>
  <p class="emitra-subtitle">
    Search government services, required documents, forms and apply support.
  </p>

  <div class="emitra-filter-box">
    <div class="emitra-filter-row">
      <input
        type="text"
        id="serviceSearch"
        class="emitra-search"
        placeholder="Search by service, documents, fees..."
      >

      <select id="categoryFilter" class="emitra-category">
        <option value="">All Categories</option>
      </select>

      <button class="clear-filter-btn" onclick="clearFilters()">Clear</button>
    </div>

    <div class="emitra-count">
      Showing <strong id="showingCount">0</strong> of <strong id="totalCount">0</strong> services
    </div>
  </div>

  <div id="emitraServicesContainer" class="emitra-card-grid">
    <div class="emitra-empty">Loading Services...</div>
  </div>
</section>

<script src="js/visitor.js"></script>

<script>
const WHATSAPP_NUMBER = "919079209552";

const searchBox = document.getElementById("serviceSearch");
const categoryFilter = document.getElementById("categoryFilter");
const container = document.getElementById("emitraServicesContainer");
const showingCount = document.getElementById("showingCount");
const totalCount = document.getElementById("totalCount");

let allServices = [];

async function loadServices() {
  try {
    const res = await fetch("/api/emitra-services");
    allServices = await res.json();

    totalCount.innerText = allServices.length;
    loadCategories();
    applyFilters();
  } catch (err) {
    console.error(err);
    container.innerHTML = '<div class="emitra-empty">Unable to load services.</div>';
  }
}

function loadCategories() {
  const categories = [...new Set(
    allServices
      .map(service => service.category)
      .filter(Boolean)
  )];

  categoryFilter.innerHTML = '<option value="">All Categories</option>';

  categories.forEach(category => {
    categoryFilter.innerHTML += `<option value="${category}">${category}</option>`;
  });
}

function cleanText(value, limit) {
  const text = String(value || "").trim();

  if (!text) return "N/A";

  const spaced = text.replace(/([A-Z0-9]){18,}/g, function(match) {
    return match.match(/.{1,12}/g).join(" ");
  });

  return spaced.length > limit ? spaced.substring(0, limit) + "..." : spaced;
}

function applyFilters() {
  const keyword = searchBox.value.toLowerCase().trim();
  const selectedCategory = categoryFilter.value.toLowerCase().trim();

  const filtered = allServices.filter(service => {
    const name = String(service.name || "").toLowerCase();
    const category = String(service.category || "").toLowerCase();
    const documents = String(service.documents || "").toLowerCase();
    const fees = String(service.fees || "").toLowerCase();
    const processingTime = String(service.processingTime || "").toLowerCase();
    const description = String(service.description || "").toLowerCase();

    const matchKeyword =
      name.includes(keyword) ||
      category.includes(keyword) ||
      documents.includes(keyword) ||
      fees.includes(keyword) ||
      processingTime.includes(keyword) ||
      description.includes(keyword);

    const matchCategory =
      !selectedCategory || category === selectedCategory;

    return matchKeyword && matchCategory;
  });

  renderServices(filtered);
}

function renderServices(services) {
  showingCount.innerText = services.length;

  if (!services.length) {
    container.innerHTML = `
      <div class="emitra-empty">
        No services found. Try another search or category.
      </div>
    `;
    return;
  }

  container.innerHTML = services.map(service => {
    const message = encodeURIComponent(
      `Hello Neeraj Ji, I want to apply for ${service.name}. Please guide me.`
    );

    const isInactive = String(service.status || "Active").toLowerCase() === "inactive";

    return `
      <div class="emitra-card-box">
        <div class="emitra-card-body">
          <span class="category-badge">${cleanText(service.category, 45)}</span>

          <h3>${cleanText(service.name, 45)}</h3>

          <p><strong>Documents:</strong> ${cleanText(service.documents, 95)}</p>
          <p><strong>Fees:</strong> ${cleanText(service.fees, 35)}</p>
          <p><strong>Processing Time:</strong> ${cleanText(service.processingTime, 35)}</p>

          <p>
            <strong>Status:</strong>
            <span class="status-badge ${isInactive ? "inactive" : ""}">
              ${cleanText(service.status || "Active", 25)}
            </span>
          </p>

          ${
            service.description
              ? `<p>${cleanText(service.description, 90)}</p>`
              : ""
          }
        </div>

        <div class="emitra-actions">
          ${
            service.formPdf
              ? `<a class="emitra-action-btn dark" href="${service.formPdf}" target="_blank" download>📂 Download Form</a>`
              : ""
          }

          <a
            class="emitra-action-btn"
            target="_blank"
            href="https://wa.me/${WHATSAPP_NUMBER}?text=${message}"
          >
            📲 Apply on WhatsApp
          </a>
        </div>
      </div>
    `;
  }).join("");
}

function clearFilters() {
  searchBox.value = "";
  categoryFilter.value = "";
  applyFilters();
}

searchBox.addEventListener("input", applyFilters);
categoryFilter.addEventListener("change", applyFilters);

loadServices();
</script>

</body>
</html>
