<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Create Account | Neeraj.dev</title>
  <meta name="description" content="Create an account on Neeraj.dev to access dashboard and protected website features.">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar">
    <div class="logo">Neeraj.dev</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="gallery.html">Gallery</a>
      <a href="resume.html">Resume</a>
      <a href="hire.html">Hire Me</a>
      <a href="contact.html">Contact</a>
      <a href="login.html">Login</a>
      <a href="/admin">Admin</a>
    </div>
  </nav>

  <section class="section">
    <form class="form-box" onsubmit="handleRegister(event)">
      <h2>Create Account</h2>

      <p style="margin-bottom:20px;">
        Register to access your user dashboard and website features.
      </p>

      <input
        name="name"
        type="text"
        placeholder="Full Name"
        required
      >

      <input
        name="email"
        type="email"
        placeholder="Email Address"
        required
      >

      <input
        name="password"
        type="password"
        placeholder="Create Password"
        required
      >

      <button class="btn" type="submit">
        Create Account
      </button>

      <p style="margin-top:20px;">
        Already registered?
        <a href="login.html">Login here</a>
      </p>
    </form>
  </section>

  <footer class="footer">
    © 2026 Neeraj Swami. All Rights Reserved.
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
