<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>About Neeraj Swami | Full Stack Developer & IT Support Assistant</title>

<meta name="description" content="Learn about Neeraj Swami, e-Mitra service expert, IT Support Assistant and aspiring Full Stack Developer.">

<link rel="stylesheet" href="css/style.css">

<style>
.about-page{
  padding:60px 7%;
  background:#fff7fb;
}

.about-hero{
  background:#fff;
  border:1px solid #fce7f3;
  border-radius:24px;
  padding:35px;
  box-shadow:0 14px 40px rgba(0,0,0,.07);
}

.about-hero h1{
  font-size:38px;
  color:#db2777;
  margin-bottom:12px;
}

.about-hero p{
  color:#374151;
  font-size:17px;
  line-height:1.7;
}

.about-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:24px;
  margin-top:28px;
}

.about-info-card{
  background:#fff;
  border:1px solid #fce7f3;
  border-radius:22px;
  padding:26px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.about-info-card.full{
  grid-column:1 / -1;
}

.about-info-card h3{
  color:#111827;
  font-size:22px;
  margin-bottom:12px;
}

.about-info-card p{
  color:#374151;
  line-height:1.7;
  white-space:pre-line;
}

.skill-tags{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.skill-tags span{
  background:#fce7f3;
  color:#be185d;
  padding:9px 13px;
  border-radius:30px;
  font-weight:700;
  font-size:14px;
}

.connect-box{
  margin-top:28px;
  background:#111827;
  color:white;
  border-radius:24px;
  padding:32px;
  text-align:center;
}

.connect-box h3{
  font-size:26px;
  margin-bottom:12px;
}

.connect-box p{
  color:#e5e7eb;
  line-height:1.7;
}

@media(max-width:800px){
  .about-grid{
    grid-template-columns:1fr;
  }

  .about-hero h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="logo">
    <img id="siteLogoImage" src="" alt="Logo">
    <span id="siteLogoText">Neeraj.dev</span>
  </div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="gallery.html">Gallery</a>
    <a href="resume.html">Resume</a>
    <a href="hire.html">Hire Me</a>
    <a href="contact.html">Contact</a>
    
  </div>
</nav>

<section class="about-page">
  <div class="about-hero">
    <h1 id="aboutName">Loading...</h1>
    <p id="aboutExperience"></p>
  </div>

  <div class="about-grid">
    <div class="about-info-card">
      <h3>Currently Working</h3>
      <p id="aboutCurrentWork"></p>
    </div>

    <div class="about-info-card">
      <h3>Language Knowledge</h3>
      <p id="aboutLanguages"></p>
    </div>

    <div class="about-info-card full">
      <h3>My Skills</h3>
      <div id="aboutSkills" class="skill-tags"></div>
    </div>

    <div class="about-info-card full">
      <h3>My Education</h3>
      <p id="aboutEducation"></p>
    </div>
  </div>

  <div class="connect-box">
    <h3>Let's Connect and Grow Together</h3>
    <p id="aboutConnect"></p>
  </div>
</section>

<div id="socialLinks" class="social-links"></div>

<footer class="footer" id="footerTextDisplay">Loading...</footer>

<a id="whatsappFloat" class="whatsapp-float" href="#" target="_blank">
  WhatsApp
</a>

<script src="js/visitor.js"></script>
<script src="js/app.js"></script>

<script>
async function loadAboutPage(){
  try{
    const res = await fetch("/api/about");
    const data = await res.json();

    document.getElementById("aboutName").innerText =
      data.name || "Neeraj Swami";

    document.getElementById("aboutExperience").innerText =
      data.experience || "I have 4+ years of experience in e-Mitra services, government documentation, online applications and citizen support.";

    document.getElementById("aboutCurrentWork").innerText =
      data.currentWork || "IT Support Assistant at NHAI";

    document.getElementById("aboutLanguages").innerText =
      data.languages || "Hindi, English, Punjabi";

    document.getElementById("aboutEducation").innerText =
      data.education || "RBSE Senior Secondary, Bachelor of Arts from MGSU Bikaner, PGDCA from JRRSU Jaipur";

    document.getElementById("aboutConnect").innerText =
      data.connect || "Let's connect and grow together with technology, digital services and professional support.";

    const skills = String(data.skills || "Python, SQL, HTML, CSS, JavaScript, Node.js, FastAPI, Flask, MySQL, SQLite, MS Office")
      .split(",")
      .map(skill => skill.trim())
      .filter(Boolean);

    document.getElementById("aboutSkills").innerHTML = skills
      .map(skill => `<span>${escapeHTML(skill)}</span>`)
      .join("");

  }catch(error){
    console.error("About page loading error:", error);
  }
}

function escapeHTML(value){
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

loadAboutPage();
</script>

</body>
